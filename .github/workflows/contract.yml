name: CAM benchmark contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  v2-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python benchmark/lm-eval/test_contract.py
